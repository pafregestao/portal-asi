<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#1a3a5c;--ok:#2d7a3a;--warn:#b8630a;--bad:#c0392b;--bg:#f4f4ef;--card:#fff;--border:#e4e4dc;--txt:#1a1a1a;--txt2:#666;--txt3:#999}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--txt);min-height:100vh}
.hdr{background:var(--azul);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.back-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;flex-shrink:0}
.hdr-title{flex:1}.hdr-title h1{font-size:15px;font-weight:700}.hdr-title p{font-size:11px;opacity:.65;margin-top:1px}
.wrap{max-width:960px;margin:0 auto;padding:14px 14px 40px}
.sec{font-size:10px;font-weight:700;color:var(--txt3);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.mc{background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid var(--border)}
.mc-lbl{font-size:10px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.mc-val{font-size:20px;font-weight:700;color:var(--azul)}
.badge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.badge.ok{background:#e8f5e9;color:#2d7a3a}
.badge.blue{background:#e3f0fb;color:#1565c0}
.badge.gray{background:#f0efe8;color:#555}
.usuario-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f4f4ef;cursor:pointer;transition:background .1s}
.usuario-row:last-child{border-bottom:none}
.usuario-row:hover{background:#fafaf8;margin:0 -16px;padding:11px 16px;border-radius:8px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.acesso-badge{background:var(--azul);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:3px 9px;min-width:28px;text-align:center}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
.modal-overlay.on{display:flex}
.modal-box{background:var(--card);border-radius:16px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;margin-bottom:40px}
.modal-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:10;border-radius:16px 16px 0 0}
.modal-body{padding:16px 20px}
.close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--txt3);line-height:1}
.acesso-item{padding:10px 0;border-bottom:1px solid #f4f4ef}
.acesso-item:last-child{border-bottom:none}
.abas-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.aba-chip{font-size:10px;padding:2px 8px;border-radius:99px;background:#f0f5fb;color:#1565c0;border:1px solid #bbdefb}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--txt2);width:110px;flex-shrink:0;text-align:right}
.bar-track{flex:1;background:#f0f0ea;border-radius:99px;height:14px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--azul);transition:width .5s ease}
.bar-val{font-size:11px;color:var(--txt3);width:65px;flex-shrink:0}
.loading{text-align:center;padding:40px;color:var(--txt3);font-size:13px}
.filtro-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtro-btn{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--txt2);cursor:pointer}
.filtro-btn.on{background:var(--azul);color:#fff;border-color:var(--azul)}
</style>

<body>

<div class="hdr">
  <a class="back-btn" href="index.html">← Voltar</a>
  <div class="hdr-title">
    <h1>📊 Histórico de Acessos</h1>
    <p>Portal Altos Santa Izabel</p>
  </div>
</div>

<div class="wrap">
  <div id="loading" class="loading">⏳ Carregando dados...</div>
  <div id="conteudo" style="display:none">

    <div class="metrics" id="metricas-gerais"></div>

    <div class="sec">Abas mais acessadas</div>
    <div class="card" id="grafico-abas"><div style="color:var(--txt3);font-size:13px">Aguardando dados...</div></div>

    <div class="sec">Tempo médio por aba (minutos)</div>
    <div class="card" id="grafico-tempo"><div style="color:var(--txt3);font-size:13px">Aguardando dados...</div></div>

    <div class="sec">Moradores — histórico de acesso</div>
    <div class="filtro-row">
      <button class="filtro-btn on" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filtro-btn" onclick="setFiltro('hoje',this)">Hoje</button>
      <button class="filtro-btn" onclick="setFiltro('semana',this)">Esta semana</button>
      <button class="filtro-btn" onclick="setFiltro('mes',this)">Este mês</button>
    </div>
    <div class="card" style="padding:0 16px" id="lista-usuarios"></div>

  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-hdr">
      <div>
        <div style="font-weight:700;font-size:15px" id="modal-nome">—</div>
        <div style="font-size:12px;color:var(--txt3)" id="modal-sub">—</div>
      </div>
      <button class="close-btn" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAxifeD5tvV3A4s4SE6d5-P-HyI1Pf0h8s",
  authDomain:"portal-altos-santa-izabel.firebaseapp.com",
  projectId:"portal-altos-santa-izabel",
  storageBucket:"portal-altos-santa-izabel.firebasestorage.app",
  messagingSenderId:"314879065622",
  appId:"1:314879065622:web:76be1b38e018a0cbed3f37"
});
var auth=firebase.auth();
var db=firebase.firestore();

var todosAcessos=[];
var todosUsuarios=[];
var filtroAtual='todos';

var ABAS_LABEL={inicio:'Início',projetos:'Projetos',orcamentos:'Orçamentos',contratos:'Contratos',churrasqueira:'Churrasqueira',financeiro:'Financeiro',documentos:'Documentos',prestadores:'Prestadores',assembleias:'Assembleias',defeitos:'Defeitos',sugestoes:'Sugestões',mapa:'Mapa',vagas:'Vagas'};
var CORES=['#1a3a5c','#1565c0','#2d7a3a','#b8630a','#7c3aed','#c0392b','#0097a7','#558b2f','#e65100','#ad1457','#4527a0','#00695c'];

auth.onAuthStateChanged(function(user){
  if(!user){window.location.href='auth.html';return;}
  db.collection('usuarios').doc(user.uid).get().then(function(doc){
    if(!doc.exists||doc.data().perfil!=='admin'){window.location.href='index.html';return;}
    carregarDados();
  });
});

function carregarDados(){
  Promise.all([
    db.collection('usuarios').get(),
    db.collection('acessos').get()
  ]).then(function(res){
    todosUsuarios=[];
    res[0].forEach(function(doc){
      if(doc.data().perfil!=='admin') todosUsuarios.push(Object.assign({uid:doc.id},doc.data()));
    });
    todosAcessos=[];
    res[1].forEach(function(doc){
      todosAcessos.push(Object.assign({uid:doc.id},doc.data()));
    });
    document.getElementById('loading').style.display='none';
    document.getElementById('conteudo').style.display='block';
    renderTudo();
  }).catch(function(e){
    document.getElementById('loading').textContent='Erro ao carregar: '+e.message;
  });
}

function setFiltro(f,btn){
  filtroAtual=f;
  document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  renderListaUsuarios();
}

function filtrarPeriodo(registros){
  if(filtroAtual==='todos') return registros;
  var agora=new Date();
  return registros.filter(function(r){
    var d=new Date(r.ts);
    if(filtroAtual==='hoje') return d.toDateString()===agora.toDateString();
    if(filtroAtual==='semana') return (agora-d)/(86400000)<=7;
    if(filtroAtual==='mes') return d.getMonth()===agora.getMonth()&&d.getFullYear()===agora.getFullYear();
    return true;
  });
}

function renderTudo(){
  renderMetricas();
  renderGraficoAbas();
  renderGraficoTempo();
  renderListaUsuarios();
}

function renderMetricas(){
  var totalAcessos=0, ativos=0, hoje=new Date().toDateString(), acessosHoje=0;
  todosAcessos.forEach(function(a){
    var regs=a.registros||[];
    totalAcessos+=regs.length;
    if(regs.length) ativos++;
    regs.forEach(function(r){if(new Date(r.ts).toDateString()===hoje) acessosHoje++;});
  });
  document.getElementById('metricas-gerais').innerHTML=
    mkmc('Total acessos',totalAcessos)+mkmc('Hoje',acessosHoje)+mkmc('Usuários ativos',ativos)+mkmc('Moradores',todosUsuarios.length);
}
function mkmc(l,v){return '<div class="mc"><div class="mc-lbl">'+l+'</div><div class="mc-val">'+v+'</div></div>';}

function renderGraficoAbas(){
  var cnt={};
  todosAcessos.forEach(function(a){(a.registros||[]).forEach(function(r){(r.abas||[]).forEach(function(ab){cnt[ab.aba]=(cnt[ab.aba]||0)+(ab.cliques||0);});});});
  renderBarras('grafico-abas',cnt,'cliques');
}

function renderGraficoTempo(){
  var tempos={},conts={};
  todosAcessos.forEach(function(a){(a.registros||[]).forEach(function(r){(r.abas||[]).forEach(function(ab){if(ab.tempo>0){tempos[ab.aba]=(tempos[ab.aba]||0)+ab.tempo;conts[ab.aba]=(conts[ab.aba]||0)+1;}});});});
  var medias={};
  Object.keys(tempos).forEach(function(k){var m=Math.round(tempos[k]/conts[k]/60);if(m>0) medias[k]=m;});
  renderBarras('grafico-tempo',medias,'min');
}

function renderBarras(elId,dados,unidade){
  var el=document.getElementById(elId);
  var keys=Object.keys(dados).sort(function(a,b){return dados[b]-dados[a];});
  if(!keys.length){el.innerHTML='<div style="color:var(--txt3);font-size:13px">Nenhum dado ainda — os dados aparecem conforme os moradores navegam.</div>';return;}
  var max=dados[keys[0]]||1;
  el.innerHTML=keys.map(function(k,i){
    var pct=Math.round((dados[k]/max)*100);
    return '<div class="bar-row">'+
      '<div class="bar-label">'+(ABAS_LABEL[k]||k)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+CORES[i%CORES.length]+'"></div></div>'+
      '<div class="bar-val">'+dados[k]+' '+unidade+'</div></div>';
  }).join('');
}

function renderListaUsuarios(){
  var el=document.getElementById('lista-usuarios');
  var lista=todosUsuarios.map(function(u){
    var da=todosAcessos.find(function(a){return a.uid===u.uid;})||{registros:[]};
    var regs=filtrarPeriodo(da.registros||[]);
    var ultimo=regs.length?new Date(regs[regs.length-1].ts):null;
    return {u:u,regs:regs,ultimo:ultimo};
  }).sort(function(a,b){
    if(!a.ultimo&&!b.ultimo) return 0;
    if(!a.ultimo) return 1; if(!b.ultimo) return -1;
    return b.ultimo-a.ultimo;
  });

  el.innerHTML=lista.map(function(item,i){
    var u=item.u, regs=item.regs, ult=item.ultimo;
    var ini=(u.nome||'?').split(' ').map(function(p){return p[0];}).join('').substring(0,2).toUpperCase();
    var cor=CORES[i%CORES.length];
    var ultStr=ult?formatData(ult):'Nunca acessou';
    return '<div class="usuario-row" onclick="abrirDetalhe(\''+u.uid+'\')">'+
      '<div class="avatar" style="background:'+cor+'">'+ini+'</div>'+
      '<div style="flex:1">'+
        '<div style="font-weight:600">'+escHtml(u.nome||'')+'</div>'+
        '<div style="font-size:11px;color:var(--txt3)">Apto '+escHtml(u.unidade||'—')+' · '+ultStr+'</div>'+
      '</div>'+
      (regs.length?'<div class="acesso-badge">'+regs.length+'</div>':'<span style="font-size:11px;color:var(--txt3)">—</span>')+
      '<span style="color:var(--txt3);margin-left:8px;font-size:16px">›</span>'+
    '</div>';
  }).join('')||'<div style="padding:16px;color:var(--txt3);font-size:13px">Nenhum dado no período.</div>';
}

function abrirDetalhe(uid){
  var u=todosUsuarios.find(function(x){return x.uid===uid;})||{};
  var da=todosAcessos.find(function(a){return a.uid===uid;})||{registros:[]};
  var regs=(da.registros||[]).slice().reverse();
  document.getElementById('modal-nome').textContent=u.nome||'—';
  document.getElementById('modal-sub').textContent='Apto '+(u.unidade||'—')+' · '+regs.length+' acessos registrados';

  var html='';
  if(!regs.length){
    html='<div style="color:var(--txt3);font-size:13px;padding:12px 0">Nenhum acesso registrado ainda.</div>';
  } else {
    var totalCliques=0, contagemAbas={};
    regs.forEach(function(r){(r.abas||[]).forEach(function(ab){totalCliques+=ab.cliques||0;contagemAbas[ab.aba]=(contagemAbas[ab.aba]||0)+(ab.cliques||0);});});
    var abaFav=Object.keys(contagemAbas).sort(function(a,b){return contagemAbas[b]-contagemAbas[a];})[0];
    html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">'+
      mkmc('Sessões',regs.length)+mkmc('Cliques totais',totalCliques)+
      '<div class="mc"><div class="mc-lbl">Aba favorita</div><div class="mc-val" style="font-size:13px;margin-top:4px">'+(ABAS_LABEL[abaFav]||abaFav||'—')+'</div></div>'+
    '</div>';
    html+='<div style="font-size:10px;font-weight:700;color:var(--txt3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">Sessões</div>';
    regs.forEach(function(r){
      var dt=new Date(r.ts);
      var abas=r.abas||[];
      html+='<div class="acesso-item">'+
        '<div style="display:flex;justify-content:space-between;align-items:center">'+
          '<div>'+
            '<div style="font-size:12px;font-weight:700;color:var(--azul)">'+formatDataCompleta(dt)+'</div>'+
            '<div style="font-size:11px;color:var(--txt3)">'+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+(r.duracao?' · '+Math.round(r.duracao/60)+' min na sessão':'')+'</div>'+
          '</div>'+
          '<span class="badge blue">'+abas.length+' abas</span>'+
        '</div>'+
        (abas.length?'<div class="abas-chips">'+abas.map(function(ab){
          return '<span class="aba-chip">'+(ABAS_LABEL[ab.aba]||ab.aba)+' ('+ab.cliques+'x'+(ab.tempo?' · '+Math.round(ab.tempo/60)+'min':'')+')</span>';
        }).join('')+'</div>':'')+
      '</div>';
    });
  }
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('on');
}

function fecharModal(){document.getElementById('modalOverlay').classList.remove('on');}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)fecharModal();});

function formatData(d){
  var hoje=new Date(),ontem=new Date(hoje);ontem.setDate(ontem.getDate()-1);
  if(d.toDateString()===hoje.toDateString()) return 'Hoje '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===ontem.toDateString()) return 'Ontem '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function formatDataCompleta(d){
  var dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return dias[d.getDay()]+', '+d.toLocaleDateString('pt-BR');
}
function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
